<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Profile Photo Grid</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 20px;
			background: #101827;
			color: #f8fafc;
			font: 16px system-ui, sans-serif;
		}

		main {
			max-width: 720px;
			margin: auto;
		}

		h1 {
			margin: 0 0 6px;
			font-size: clamp(1.5rem, 5vw, 2.2rem);
		}

		p {
			margin: 0 0 22px;
			color: #aab7ca;
		}

		.card {
			padding: clamp(18px, 4vw, 30px);
			background: #1e293b;
			border: 1px solid #334155;
			border-radius: 18px;
			box-shadow: 0 15px 40px #0005;
		}

		.fields {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 14px;
		}

		label {
			color: #cbd5e1;
			font-size: 0.9rem;
		}

		input {
			display: block;
			width: 100%;
			margin-top: 6px;
			padding: 12px;
			border: 1px solid #475569;
			border-radius: 9px;
			background: #0f172a;
			color: #fff;
			font: inherit;
		}

		input:focus {
			outline: 2px solid #60a5fa;
		}

		button {
			margin-top: 18px;
			padding: 12px 16px;
			border: 0;
			border-radius: 9px;
			background: #2563eb;
			color: white;
			font-weight: 700;
			cursor: pointer;
		}

		button:disabled {
			opacity: 0.55;
			cursor: wait;
		}

		.save {
			margin-left: 8px;
			background: #059669;
		}

		canvas {
			display: block;
			width: 100%;
			max-width: 640px;
			aspect-ratio: 1;
			margin: 24px auto 0;
			border-radius: 12px;
			background: #334155;
		}

		.note {
			margin-top: 12px;
			color: #94a3b8;
			font-size: 0.8rem;
		}

		@media (max-width: 480px) {
			.fields {
				grid-template-columns: 1fr;
			}

			.save {
				margin-left: 4px;
			}
		}
	</style>
</head>

<body>
	<main>
		<section class="card">
			<h1>Profile Photo Grid</h1>
			<p>Choose four images to make a square 2×2 photo.</p>

			<div class="fields">
				<label>Image 1<input class="image" type="file" accept="image/*"></label>
				<label>Image 2<input class="image" type="file" accept="image/*"></label>
				<label>Image 3<input class="image" type="file" accept="image/*"></label>
				<label>Image 4<input class="image" type="file" accept="image/*"></label>
			</div>

			<button id="make">Create grid</button>
			<button id="save" class="save" disabled>Save photo</button>
			<canvas id="canvas" width="1200" height="1200"></canvas>
			<div class="note">Choose four image files. A fallback tile appears if an image cannot load.</div>
		</section>
	</main>

	<script>
		const canvas = document.getElementById('canvas');
		const ctx = canvas.getContext('2d');
		const fields = [...document.querySelectorAll('.image')];
		const save = document.getElementById('save');

		function load(file) {
			return new Promise((resolve) => {
				if (!file) {
					resolve(null);
					return;
				}

				const img = new Image();
				img.onload = () => resolve(img);
				img.onerror = () => resolve(null);
				img.src = URL.createObjectURL(file);
			});
		}

		function draw(images) {
			const size = 600;
			ctx.fillStyle = '#111827';
			ctx.fillRect(0, 0, 1200, 1200);

			images.forEach((img, index) => {
				const x = (index % 2) * size;
				const y = Math.floor(index / 2) * size;

				if (img) {
					const scale = Math.max(size / img.width, size / img.height);
					const width = img.width * scale;
					const height = img.height * scale;
					ctx.drawImage(img, x + (size - width) / 2, y + (size - height) / 2, width, height);
				} else {
					ctx.fillStyle = ['#2563eb', '#7c3aed', '#db2777', '#d97706'][index];
					ctx.fillRect(x, y, size, size);
				}
			});
		}

		document.getElementById('make').onclick = async () => {
			const button = document.getElementById('make');
			button.disabled = true;
			button.textContent = 'Creating…';
			draw(await Promise.all(fields.map((field) => load(field.files[0]))));
			save.disabled = false;
			button.disabled = false;
			button.textContent = 'Create grid';
		};

		save.onclick = () => {
			const link = document.createElement('a');
			link.download = 'dray-photo-grid.png';
			link.href = canvas.toDataURL('image/png');
			link.click();
		};

		draw([null, null, null, null]);
	</script>
</body>

</html>
