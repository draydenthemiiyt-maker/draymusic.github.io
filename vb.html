<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tap to Vibrate</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    color: #fff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  .page {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
    touch-action: manipulation;
  }

  .text {
    font-size: 1.6rem;
  }

  .shake {
    animation: shake 0.12s infinite;
  }

  @keyframes shake {
    0%   { transform: translate(2px, 0); }
    25%  { transform: translate(-2px, 0); }
    50%  { transform: translate(2px, 0); }
    75%  { transform: translate(-2px, 0); }
    100% { transform: translate(2px, 0); }
  }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="text">Tap anywhere to vibrate<br>Hold to shake the page</div>
</div>

<script>
  const page = document.getElementById('page');
  let holding = false;

  // Single tap vibration
  page.addEventListener('click', () => {
    if (navigator.vibrate) navigator.vibrate(100);
  });

  // Start constant vibration + shake
  page.addEventListener('pointerdown', () => {
    holding = true;
    document.body.classList.add('shake');

    // Constant vibration loop
    const loop = () => {
      if (!holding) return;
      navigator.vibrate(100);
      requestAnimationFrame(loop);
    };
    loop();
  });

  // Stop vibration + shake
  const stop = () => {
    holding = false;
    document.body.classList.remove('shake');
    navigator.vibrate(0);
  };

  page.addEventListener('pointerup', stop);
  page.addEventListener('pointerleave', stop);
</script>
</body>
</html>
